<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat">
    <header class="chat__header">
      <h1>Chatbot</h1>
      <div class="chat__actions">
        <button id="upload-btn" type="button">Upload</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <input id="file-input" type="file" accept=".pdf,.txt,.docx" hidden />
    </header>

    <div id="messages" class="chat__messages" aria-live="polite"></div>

    <div class="chat__input">
      <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send" type="button">Send</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
